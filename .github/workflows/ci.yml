name: CI

on:
  push:
    branches: [master, main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: client-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-windows:
    name: Frontend, Rust and runtime contract
    runs-on: windows-latest
    timeout-minutes: 35
    defaults:
      run:
        working-directory: ClientController
    steps:
      - name: Checkout ClientController
        uses: actions/checkout@v4
        with:
          path: ClientController

      - name: Checkout AiUserFactory workflow runtime
        uses: actions/checkout@v4
        with:
          repository: lucasz1991/AiUserFactory
          path: AiUserFactory

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.12.0'
          cache: npm
          cache-dependency-path: ClientController/package-lock.json

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cache Rust build
        uses: swatinem/rust-cache@v2
        with:
          workspaces: ClientController/src-tauri

      - name: Install frontend dependencies
        run: npm ci

      - name: Audit frontend dependencies
        run: npm audit --audit-level=high

      - name: Synchronize workflow runtime
        run: npm run sync:workflow-runtime

      - name: Verify synchronized runtime files
        shell: pwsh
        run: |
          git diff --no-index --exit-code -- ..\AiUserFactory\node\workflows src-tauri\resources\workflow-runtime\node\workflows
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git diff --no-index --exit-code -- ..\AiUserFactory\resources\node\register\lib src-tauri\resources\workflow-runtime\resources\node\register\lib

      - name: Build frontend
        run: npm run build

      - name: Check Rust formatting
        run: cargo fmt --manifest-path src-tauri/Cargo.toml --all -- --check

      - name: Run Clippy
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings

      - name: Run Rust tests
        run: cargo test --manifest-path src-tauri/Cargo.toml

      - name: Install Cargo audit
        run: cargo install cargo-audit --locked

      - name: Audit Rust dependencies
        run: cargo audit --file src-tauri/Cargo.lock
